site_name: Sylva
site_description: Terrestrial laser scanning processing for forest ecology, with a Rust core
site_author: Tim Devereux, The University of Queensland
copyright: "&copy; 2026 Tim Devereux, The University of Queensland &middot; GPL-3.0-or-later"
repo_url: https://github.com/UQ-EORC/Sylva
repo_name: UQ-EORC/Sylva
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Install: install.md
  - Guide:
      - Plot workflow: guide/quickstart.md
      - Point clouds and files: guide/io.md
      - Filtering and registration: guide/preprocessing.md
      - Trees and crowns: guide/trees.md
      - Pulse data: guide/pulses.md
      - Ray-traced voxels: guide/voxels.md
      - QSMs: guide/qsm.md
      - Leaves on a QSM: guide/leaves.md
      - Scan quality: guide/quality.md
      - Command line: guide/cli.md
      - Operational use: guide/operational.md
  - Examples:
      - Overview: examples/index.md
      - 1. Point clouds and I/O: examples/01_pointclouds_io.ipynb
      - 2. Filtering: examples/02_filtering.ipynb
      - 3. Registration: examples/03_registration.ipynb
      - 4. Ground and height: examples/04_ground.ipynb
      - 5. Trees: examples/05_trees.ipynb
      - 6. QSMs: examples/06_qsm.ipynb
      - 7. Canopy structure: examples/07_canopy.ipynb
      - 8. Pulses and shots files: examples/08_shots.ipynb
      - 9. Ray-traced voxels: examples/09_voxels.ipynb
      - 10. A RIEGL project, end to end: examples/10_riscan_pipeline.ipynb
  - Benchmarks:
      - Tree detection: benchmarks/trees.md
      - QSMs: benchmarks/qsm.md
      - Canopy gap profiles: benchmarks/canopy.md
  - API reference:
      - Function index: api/index.md
      - PointCloud, Raster: api/pointcloud.md
      - io: api/io.md
      - Shots, RiSCAN: api/shots.md
      - filters: api/filters.md
      - ground: api/ground.md
      - trees: api/trees.md
      - canopy: api/canopy.md
      - voxels: api/voxels.md
      - registration: api/registration.md
      - coreg: api/coreg.md
      - qsm: api/qsm.md
      - leaves: api/leaves.md
      - quality: api/quality.md
      - progress: api/progress.md
      - limits: api/limits.md
      - synthetic: api/synthetic.md
  - Development: development.md
  - Releasing: release.md
  - References: references.md

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  examples/build_notebooks.py
  examples/make_litch_subset.py
  examples/build_riscan_notebook.py
  examples/data/*.laz
  examples/data/*.parquet

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
