      - Reading the core without Rust: dev/reading-the-core.md
  - Releasing: release.md
  - References: references.md

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  examples/build_notebooks.py
  examples/make_litch_subset.py
  examples/make_buttress_subset.py
  examples/build_riscan_notebook.py
  examples/data/*.laz
  examples/data/*.parquet

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
