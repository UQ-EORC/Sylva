site_name: Sylva
site_description: LiDAR processing for forest ecology and remote sensing research, with a Rust core
site_author: Tim Devereux, The University of Queensland
copyright: "&copy; 2026 Tim Devereux, The University of Queensland &middot; GPL-3.0-or-later"
repo_url: https://github.com/UQ-EORC/Sylva
repo_name: UQ-EORC/Sylva
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Install: install.md
  - Guide:
      - Plot workflow: guide/quickstart.md
      - Point clouds and files: guide/io.md
      - Filtering and registration: guide/preprocessing.md
      - Masking: guide/masking.md
      - Coordinates: guide/coordinates.md
      - Trees and crowns: guide/trees.md
      - Pulse data: guide/pulses.md
      - Ray-traced voxels: guide/voxels.md
      - Interpolation: guide/interpolation.md
      - Plots in tiles: guide/tiles.md
      - Airborne lidar tiles: guide/als.md
      - Area-based ALS metrics: guide/als_metrics.md
      - Full waveforms: guide/waveform.md
      - Airborne canopy structure: guide/als_canopy.md
      - Airborne trees: guide/als_trees.md
      - Change detection: guide/change.md
      - TLS and ALS together: guide/fusion.md
      - Airborne change: guide/change_als.md
      - QSMs: guide/qsm.md
      - Leaves on a QSM: guide/leaves.md
      - Scan quality: guide/quality.md
      - Synthetic data: guide/synthetic.md
      - Command line: guide/cli.md
      - Operational use: guide/operational.md
  - Examples:
