[package]
name = "sylvar"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
# R bindings: built by R CMD INSTALL through src/Makevars, never published.
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
extendr-api = "0.9"
nalgebra = "0.35"
sylva-rs = { path = "../../../../crates/sylva-rs" }

# Built on its own by R, outside the Cargo workspace (it needs R's headers).
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
