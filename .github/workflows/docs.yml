name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "python/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "python/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages (gh-pages branch)
        type: boolean
        default: false

permissions:
  contents: write

# One deploy at a time: gh-deploy force-pushes gh-pages, so two overlapping
# runs could publish out of order. Queue them rather than cancelling, so a
# push is never dropped.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The API reference is read from the sources and the notebooks carry
      # their outputs, so the Rust extension does not have to be built here.
      - run: pip install "mkdocs>=1.6,<2" mkdocs-material "mkdocstrings[python]" mkdocs-jupyter
      - run: mkdocs build --strict
      # Every push to main publishes; a pull request only builds. A manual
      # run builds too, and publishes when asked - which is how to republish
      # without a docs change.
      - if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        run: mkdocs gh-deploy --force
