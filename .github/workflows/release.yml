name: release

# Tag vX.Y.Z (matching the version in Cargo.toml and pyproject.toml) to release:
#   wheels + sdist -> PyPI (sylva-rs), crates -> crates.io (sylva-rs, sylva-cli).
# Run it by hand (workflow_dispatch) to build everything without publishing.
#
# Both registries use trusted publishing (OIDC), so there are no tokens to store:
#   PyPI:      add a (pending) publisher for project "sylva-rs", repository
#              UQ-EORC/Sylva, workflow release.yml, environment "pypi".
#   crates.io: trusted publishing only works for a crate that already exists, so
#              the first `cargo publish` of each crate is done by hand; afterwards
#              add this repository and workflow in the crate's settings.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions agree with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          py_v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "$tag" = "$cargo_v" && test "$tag" = "$py_v" || { echo "tag $tag, Cargo $cargo_v, pyproject $py_v"; exit 1; }
      - run: cargo test --release -p sylva-rs
      - run: |
          python -m venv .venv && . .venv/bin/activate
          pip install maturin pytest numpy scipy matplotlib   # what the tests import
          maturin develop --release
          # The parity recordings are bit-level guards for the machine that made
          # them: another CPU or C library shifts the last digits, and the
          # coregistration's accept/reject decisions can follow. Every other
          # test runs.
          pytest -q --ignore=tests/test_parity.py

  wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2014"}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2014"}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # abi3: one wheel per platform serves every Python >= 3.10.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      # The wheel itself is what users get, so it is installed and run here,
      # on the platform it was built for, at both ends of the Python range
      # the abi3 tag claims. Every runner in the matrix is native.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Wheel on the oldest Python (3.10)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv-oldest"
          py="$RUNNER_TEMP/venv-oldest/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/venv-oldest/Scripts/python.exe"
          "$py" -m pip install --quiet --upgrade pip
          "$py" -m pip install --quiet dist/*.whl
          (cd "$RUNNER_TEMP" && "$py" "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Wheel on the newest Python (3.14)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv-newest"
          py="$RUNNER_TEMP/venv-newest/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/venv-newest/Scripts/python.exe"
          "$py" -m pip install --quiet --upgrade pip
          "$py" -m pip install --quiet dist/*.whl
          (cd "$RUNNER_TEMP" && "$py" "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py")
      # The whole suite against the installed wheel. It gates the release on
      # x86-64 Linux, where it is known to pass; on the other platforms it
      # has not run before, so until it has been seen green there a failure
      # is reported without stopping the release (the smoke test above does).
      - name: Test suite against the wheel
        shell: bash
        continue-on-error: ${{ matrix.target != 'x86_64-unknown-linux-gnu' }}
        run: |
          py="$RUNNER_TEMP/venv-newest/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/venv-newest/Scripts/python.exe"
          "$py" -m pip install --quiet pytest scipy matplotlib
          "$py" -m pytest -q --ignore=tests/test_parity.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # A crates.io version cannot be withdrawn, so it waits for everything PyPI
  # needs: a tag whose wheels do not build publishes to neither registry.
  crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The first version of each crate is published by hand, so a version that
      # is already on crates.io is skipped rather than failing the release.
      - name: Which crates still need this version?
        id: todo
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          todo=""
          for crate in sylva-rs sylva-cli; do      # the library first: the CLI depends on it
            if curl -fsS -A "sylva-release (github.com/UQ-EORC/Sylva)" \
                 "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "$crate $version is already published; skipping"
            else
              todo="$todo $crate"
            fi
          done
          echo "crates=$todo" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.todo.outputs.crates != ''
      - name: Publish
        if: steps.todo.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: for crate in ${{ steps.todo.outputs.crates }}; do cargo publish -p "$crate"; done
