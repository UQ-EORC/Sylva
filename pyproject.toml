[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "sylva-rs"
version = "0.1.0"
description = "Terrestrial laser scanning (TLS) processing for forest ecology and remote sensing, with a Rust core"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Devereux", email = "devereux.tj@gmail.com" }]
keywords = ["lidar", "tls", "forestry", "point cloud", "qsm", "remote sensing", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/tim-devereux/Sylva"
Documentation = "https://github.com/tim-devereux/Sylva/tree/main/docs"
Issues = "https://github.com/tim-devereux/Sylva/issues"

[project.optional-dependencies]
geotiff = ["rasterio>=1.3"]
dev = ["pytest>=7", "ruff>=0.4", "maturin>=1.5"]
examples = ["matplotlib>=3.7", "jupyterlab>=4"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25", "mkdocs-jupyter>=0.24"]

[project.scripts]
sylva = "sylva.cli:main"

[tool.maturin]
python-source = "python"
module-name = "sylva._core"
manifest-path = "crates/sylva-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells are kept as they read best in a notebook.
"docs/examples/*" = ["E501", "E402", "E702", "I001", "B905", "E401", "E741", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["sylva"]
